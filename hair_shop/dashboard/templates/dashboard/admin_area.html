{% extends 'dashboard/base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
    <h1>Панель администратора</h1>
 

 <div class="admin_buttons_panel">
  
  <input type="button" class="order_action_btn" value="На главную" onclick="window.location.href='{% url 'shop:index' %}'">
  <input type="button" onclick="window.location.href='{% url 'dashboard:manage_orders' %}'" class="order_action_btn" value="Управление заказами">
  <input type="button" class="order_action_btn" value="Добавить товар" onclick="window.location.href='{% url 'dashboard:product_create' %}'">
  <input type="button" class="order_action_btn" value="Редактировать товар" onclick="window.location.href='{% url 'shop:catalog' %}'">
  <input type="button" class="order_action_btn" value="Работа с остатками" onclick="window.location.href='{% url 'dashboard:stock_sync' %}'">
  {% comment %} <input type="button" class="order_action_btn" value="Расставить оттенки" onclick="window.location.href='{% url 'dashboard:shade_review' %}'"> {% endcomment %}
  {% comment %} <input type="button" class="order_action_btn" value="Обновить длину волос" onclick="window.location.href='{% url 'dashboard:update_hair_length' %}'"> {% endcomment %}
  {% comment %} <input type="button" class="order_action_btn" value="Обновить  оттенки волос" onclick="window.location.href='{% url 'dashboard:update_hair_shade' %}'"> {% endcomment %} 
  {% comment %} <input type="button" class="order_action_btn" value="Редактор групп" onclick="window.location.href='{% url 'dashboard:group_editor' %}'"> {% endcomment %}
<form class="auth_form" method="post" action="{% url 'users:logout' %}">
    {% csrf_token %}
    <button class="users-btn profile_logaut_btn" type="submit">Выйти</button>
</div>
{% endblock %}
