services:
  nginx:
    image: nginx:stable-alpine
    container_name: hair_shop_nginx
    restart: unless-stopped
    ports:
      - "8002:80"  # Оставляем, если NPM на другом VPS. Если NPM на этом же VPS — меняем на "8002:80"
    volumes:
      - ./conf/nginx.conf:/etc/nginx/conf.d/default.conf:ro # Кладём в conf.d, а не заменяем основной конфиг
      - ./conf/maintenance.html:/usr/share/nginx/html/maintenance.html:ro  # ← добавь
      - static_volume:/app/staticfiles # Путь должен совпадать со STATIC_ROOT в Django
      - media_volume:/app/media  
    networks:
      - web
      - npm_default
    depends_on:
      - web

web:
  build: .
  image: hair_shop_app          # <-- добавили, чтобы qcluster использовал тот же образ
  container_name: hair_shop_web
  restart: unless-stopped
  env_file:
    - .env
  environment:
    - DEBUG=False
  volumes:
    - static_volume:/app/staticfiles
    - media_volume:/app/media
  networks:
    - web
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

qcluster:
  image: hair_shop_app          # тот же образ, отдельной сборки не нужно
  container_name: hair_shop_qcluster
  restart: unless-stopped
  command: python manage.py qcluster
  env_file:
    - .env
  environment:
    - DEBUG=False
  volumes:
    - media_volume:/app/media   # нужен, если задачи читают/пишут медиа
  networks:
    - web
  stop_grace_period: 70s        # timeout=60 в Q_CLUSTER, даём задачам шанс завершиться
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    web:
      condition: service_started   # web применяет миграции/стартует первым, если они у вас там

redis:
  image: redis:7-alpine
  container_name: hair_shop_redis
  restart: unless-stopped
  command: redis-server --appendonly yes
  volumes:
    - redis_data:/data
  networks:
    - web
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 10s
    timeout: 5s
    retries: 5

volumes:
postgres_data:
static_volume:
media_volume:
redis_data:                     # <-- новый том