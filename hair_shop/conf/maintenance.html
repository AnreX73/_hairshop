<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#4e3220">
  <title>Технические работы — Студия Наталии Румянцевой</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Oswald:wght@300;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #8a5944;
      --secondary-color: #d4b8a5;
      --accent-color: #C43F44;
      --text-color: #646464;
      --dark-color: #3a2c28;
      --deep-color: #4e3220;
      --light-color: #f8f3ef;
      --card-color: #fffaf5;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background-color: var(--deep-color);
      background-image:
        radial-gradient(circle at 15% 18%, rgba(212, 184, 165, 0.22), transparent 45%),
        radial-gradient(circle at 85% 82%, rgba(196, 63, 68, 0.16), transparent 42%),
        radial-gradient(circle at 50% 0%, rgba(248, 243, 239, 0.10), transparent 60%);
      color: var(--dark-color);
      font-family: 'Oswald', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-weight: 300;
    }

    .card {
      width: 100%;
      max-width: 480px;
      padding: 3rem 2.25rem 2.5rem;
      text-align: center;
      background: var(--card-color);
      border: 1px solid rgba(138, 89, 68, 0.14);
      border-radius: 20px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.30);
    }

    .lock {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.25rem;
      color: var(--secondary-color);
      animation: sway 5s ease-in-out infinite;
    }

    .brand {
      margin-bottom: 1.35rem;
      color: var(--primary-color);
      font-family: 'Great Vibes', 'Times New Roman', Times, serif;
      font-size: 1.9rem;
      line-height: 1.2;
      font-weight: 400;
    }

    h1 {
      margin-bottom: 0.85rem;
      color: var(--dark-color);
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      line-height: 1.3;
      text-transform: uppercase;
    }

    .divider {
      width: 56px;
      height: 2px;
      margin: 0 auto 1.35rem;
      background: linear-gradient(90deg, transparent, var(--accent-color), transparent);
    }

    p {
      margin-bottom: 0.5rem;
      color: var(--text-color);
      font-size: 1rem;
      line-height: 1.6;
    }

    p:last-of-type { margin-bottom: 0; }

    .dots {
      margin-top: 1.75rem;
      line-height: 1;
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin: 0 0.25rem;
      background: var(--accent-color);
      border-radius: 50%;
      animation: pulse 1.2s ease-in-out infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    @keyframes sway {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .lock, .dot { animation: none; }
    }

    @media (max-width: 420px) {
      .card { padding: 2.5rem 1.25rem 2rem; }
      .brand { font-size: 1.65rem; }
      h1 { font-size: 1.25rem; }
      .lock { width: 60px; height: 60px; }
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <svg class="lock" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2"
         stroke-linecap="round" aria-hidden="true">
      <path d="M20 8c10 8-6 14 4 22s-6 14 4 22"/>
      <path d="M32 8c10 8-6 14 4 22s-6 14 4 22"/>
      <path d="M44 8c10 8-6 14 4 22s-6 14 4 22"/>
    </svg>
    <div class="brand">Студия Наталии Румянцевой</div>
    <h1>Технические работы</h1>
    <div class="divider" aria-hidden="true"></div>
    <p>Сайт временно недоступен.</p>
    <p>Обновляем коллекцию — и уже скоро вернёмся.</p>
    <div class="dots" aria-hidden="true">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </main>
</body>
</html>
